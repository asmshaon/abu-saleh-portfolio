name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e
            trap 'echo "❌ Deployment failed at line $LINENO"' ERR

            echo "➡️ Load NVM"
            export NVM_DIR="$HOME/.nvm"
            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              echo "❌ nvm not found at $NVM_DIR/nvm.sh"
              exit 1
            fi
            \. "$NVM_DIR/nvm.sh"

            echo "➡️ Use Node version"
            nvm use --lts

            export NODE_ENV=production

            echo "➡️ Go to project directory"
            cd /var/www/portfolio

            echo "➡️ Pull latest code"
            git pull origin main

            echo "➡️ Clean previous build"
            rm -rf .next

            echo "➡️ Install dependencies"
            npm ci --include=dev

            echo "➡️ Build Next.js app"
            npm run build

            echo "➡️ Restart app (PM2)"
            if pm2 describe portfolio-app > /dev/null 2>&1; then
              pm2 reload portfolio-app --update-env
            else
              pm2 start npm --name "portfolio-app" -- start -- --port 3001
            fi

            echo "➡️ Persist PM2 process list"
            pm2 save

            echo "✅ Deployment completed"